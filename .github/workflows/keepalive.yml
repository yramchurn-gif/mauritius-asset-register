name: Supabase keep-alive

# Free Supabase projects auto-pause after ~7 days with no real database activity.
# A read that RLS blocks wasn't enough, so this does a genuine authenticated WRITE
# once a day: it upserts a single "keepalive" heartbeat row in app_settings.
#
# Setup (one time): add a repository secret named SUPABASE_SERVICE_KEY
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Value = the project's service_role key (Supabase → Settings → API → service_role).
# The key is stored encrypted by GitHub, masked in logs, and never committed.
# This workflow only runs on schedule/manual dispatch, so fork PRs can't read it.

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated heartbeat write
        env:
          SK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SK" ]; then
            echo "SUPABASE_SERVICE_KEY secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          now=$(date -u +%FT%TZ)
          code=$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST \
            "https://tbtwpeuoglafjklsgklz.supabase.co/rest/v1/app_settings" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data "{\"key\":\"keepalive\",\"value\":{\"at\":\"$now\",\"by\":\"github-action\"},\"updated_at\":\"$now\"}")
          echo "Heartbeat write -> HTTP $code"
          case "$code" in
            2*)      echo "OK — wrote heartbeat, project is active." ;;
            401|403) echo "Auth failed — check/rotate the SUPABASE_SERVICE_KEY secret."; cat /tmp/resp; exit 1 ;;
            000)     echo "Unreachable — project is likely paused; restore it once in the dashboard, then this keeps it awake."; exit 1 ;;
            *)       echo "Unexpected response:"; cat /tmp/resp; exit 1 ;;
          esac
